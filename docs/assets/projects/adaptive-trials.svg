<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive clinical trial design</title>
  <desc id="desc">A stylized trial pathway with interim decision points and changing sample size.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07142d"/><stop offset="1" stop-color="#0b2441"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#47c8ed"/><stop offset="1" stop-color="#4ce0c1"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g opacity=".18" stroke="#47c8ed" fill="none"><circle cx="1020" cy="100" r="170"/><circle cx="1020" cy="100" r="115" stroke-dasharray="8 16"/><path d="M0 570C250 430 380 650 620 470S980 250 1200 360"/></g>
  <g transform="translate(110 115)">
    <text x="0" y="0" fill="#8fa5c3" font-family="Arial, sans-serif" font-size="25" letter-spacing="4">INTERIM LEARNING</text>
    <path d="M20 330H365" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
    <path d="M365 330C500 330 505 170 640 170H940" stroke="url(#line)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M365 330C500 330 505 470 640 470H940" stroke="#647a9a" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="16 18"/>
    <g fill="#07142d" stroke="#47c8ed" stroke-width="8" filter="url(#glow)"><circle cx="20" cy="330" r="24"/><circle cx="365" cy="330" r="31"/><circle cx="640" cy="170" r="24"/><circle cx="940" cy="170" r="24"/></g>
    <g fill="#dce8f7" font-family="Arial, sans-serif" font-weight="700" font-size="28"><text x="0" y="390">Start</text><text x="305" y="390">Interim</text><text x="590" y="125">Adapt</text><text x="880" y="125">Decision</text></g>
    <g fill="#8fa5c3" font-family="Arial, sans-serif" font-size="22"><text x="530" y="520">Continue without modification</text><text x="610" y="220">Revise sample size or population</text></g>
  </g>
</svg>
