<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Hidden states in virus activity</title>
  <desc id="desc">A stylized temporal signal moving through three latent activity states.</desc>
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07142d"/><stop offset="1" stop-color="#102940"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4ce0c1"/><stop offset=".55" stop-color="#47c8ed"/><stop offset="1" stop-color="#ff847c"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bgv)"/>
  <g opacity=".16" stroke="#47c8ed"><path d="M90 110H1110M90 230H1110M90 350H1110M90 470H1110M90 590H1110"/><path d="M180 80V620M420 80V620M660 80V620M900 80V620"/></g>
  <text x="90" y="70" fill="#8fa5c3" font-family="Arial, sans-serif" font-size="25" letter-spacing="4">LATENT ACTIVITY STATES</text>
  <path d="M85 470C165 450 190 475 255 440S355 465 420 360S520 330 585 365S690 345 745 245S840 210 905 250S1015 175 1115 150" fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="27">
    <g transform="translate(125 525)"><rect width="250" height="78" rx="20" fill="#112c47" stroke="#4ce0c1"/><text x="33" y="50" fill="#dce8f7">Low activity</text></g>
    <g transform="translate(480 400)"><rect width="250" height="78" rx="20" fill="#112c47" stroke="#47c8ed"/><text x="25" y="50" fill="#dce8f7">Rising activity</text></g>
    <g transform="translate(830 265)"><rect width="250" height="78" rx="20" fill="#112c47" stroke="#ff847c"/><text x="31" y="50" fill="#dce8f7">High activity</text></g>
  </g>
  <g fill="#07142d" stroke-width="8"><circle cx="255" cy="440" r="22" stroke="#4ce0c1"/><circle cx="585" cy="365" r="22" stroke="#47c8ed"/><circle cx="905" cy="250" r="22" stroke="#ff847c"/></g>
</svg>
